[workspace]
# `site` joins the workspace in Phase 3, once the Leptos crate exists.
members = ["shared"]

[package]
name = "rig-rag"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chunkedrs = "2.1.1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
qdrant-client = "1.19"
rig = { version = "0.44", features = ["fastembed"] }
rig-qdrant = "0.44"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
shared = { path = "shared" }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
toml = "1.1"
toml_edit = "0.25"
