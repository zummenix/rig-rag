[package]
name = "rig-rag"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chunkedrs = "2.1.1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
qdrant-client = "1.19.0"
rig = { version = "0.43.0", features = ["fastembed"] }
rig-qdrant = "0.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
