[package]
name = "site"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
futures = "0.3"
eventsource-stream = "0.2"
# Must match the `reqwest` that Leptos's `server_fn` pulls (0.13.x); mixing
# 0.12 and 0.13 drags in two `wasm-streams` versions, which both export the
# `IntoUnderlyingByteSource` JS name and make wasm-bindgen reject the build.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
serde_json = "1"
shared = { path = "../shared" }
web-sys = { version = "0.3", features = [
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Location",
    "Window",
] }
